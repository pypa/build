name: CD
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - v*
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.post[0-9]+"
  release:
    types:
      - published
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  dist:
    name: Build distribution
    runs-on: ubuntu-26.04
    permissions:
      contents: read # to checkout
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@v3.0.2
      - name: Embed wheel SBOM
        run: |
          uvx --refresh --from 'python-sbom[validate]>=0.3.1' python-sbom embed /tmp/baipp/dist/*.whl
          uvx --from 'python-sbom[validate]>=0.3.1' python-sbom validate /tmp/baipp/dist
          /tmp/baipp/bin/check-wheel-contents /tmp/baipp/dist/*.whl
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Packages-SBOM
          path: /tmp/baipp/dist/build-*
  create-release:
    name: Create GitHub Release
    needs: [dist]
    runs-on: ubuntu-26.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # to create release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create GitHub Release
        run: gh release create "$RELEASE_TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
  publish:
    name: Publish to PyPI
    needs: [dist]
    runs-on: ubuntu-26.04
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'release' && github.event.action == 'published')
    environment:
      name: pypi
      url: https://pypi.org/p/build
    permissions:
      id-token: write # to sign attestation
      attestations: write # to create attestation
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Packages-SBOM
          path: dist
      - name: Generate artifact attestation for sdist and wheel
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "dist/build-*"
      - uses: pypa/gh-action-pypi-publish@v1.14.3

name: pytest
on:
  workflow_call:
permissions: {}
jobs:
  integration-sources:
    name: Download integration sources
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.15"
      - name: Download the sources
        run: uv run --no-project --python 3.15 python tests/integration_sources.py
      - name: Share the sources with the test matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-sources
          path: .integration-sources
          retention-days: 1
          compression-level: 0 # the archives are compressed already
          include-hidden-files: true # .integration-sources is a hidden directory
          if-no-files-found: error # an empty artifact silently returns every job to its own download
  pytest:
    name: Run tests
    needs: integration-sources
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    env:
      PYTEST_ADDOPTS: "--run-integration --showlocals -vv --durations=10 --reruns 5 --only-rerun CalledProcessError --only-rerun RemoteDisconnected --only-rerun HTTPError"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - macos-26
          - windows-2025
        py:
          - "pypy3.11"
          - "pypy3.12"
          - "3.15"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
        tox-target:
          - "tox"
          - "min"
    # jobs not required in branch protection
    continue-on-error: ${{ (startsWith(matrix.py, 'pypy') && startsWith(matrix.os, 'windows')) && true || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get the integration sources
        id: integration-sources
        background: true
        # a failure here is not fatal, because the test fixture downloads the sources itself
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integration-sources
          path: .integration-sources
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.py }}
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - wait: integration-sources
      - name: Run test suite via tox
        if: matrix.tox-target == 'tox'
        shell: bash
        run: |
          tox -vv --notest -e "$PYTHON_VERSION"
          tox -e "$PYTHON_VERSION" --skip-pkg-install
        env:
          PYTHON_VERSION: ${{ matrix.py }}
      - name: Run minimum version test
        if: matrix.tox-target == 'min'
        shell: bash
        run: tox -e "min-$PYTHON_VERSION"
        env:
          PYTHON_VERSION: ${{ matrix.py }}
      - name: Run path test
        if: matrix.tox-target == 'tox' && matrix.py == '3.15'
        run: tox -e path
      - name: Combine coverage files
        if: always()
        run: tox -e coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        env:
          PYTHON: ${{ matrix.python }}
        with:
          files: .tox/coverage.xml
          flags: tests
          env_vars: PYTHON
          name: ${{ matrix.py }} - ${{ matrix.os }} - ${{ matrix.tox-target }}

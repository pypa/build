name: pytest
on:
  workflow_call:
permissions: {}
jobs:
  pytest:
    name: Run tests
    runs-on: ${{ matrix.os }}-latest
    env:
      PYTEST_ADDOPTS: "--run-integration --showlocals -vv --durations=10 --reruns 5 --only-rerun CalledProcessError --only-rerun RemoteDisconnected --only-rerun HTTPError"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu
          - macos
          - windows
        py:
          - "pypy3.10-v7.3.19"
          - "pypy3.11-v7.3.19"
          - "3.15"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"
        tox-target:
          - "tox"
          - "min"
    # jobs not required in branch protection
    continue-on-error: ${{ (startsWith(matrix.py, 'pypy') && matrix.os == 'windows') && true || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install tox (uv)
        run: uv tool install tox --with tox-uv
      - name: Setup python for test ${{ matrix.py }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.py }}
          allow-prereleases: true
      - name: Run test suite via tox
        if: matrix.tox-target == 'tox'
        shell: bash
        run: |
          PYTHON_VERSION=$PYTHON_VERSION_RAW
          BASE=${PYTHON_VERSION%-*}
          tox -vv --notest -e $BASE
          tox -e $BASE --skip-pkg-install
        env:
          PYTHON_VERSION_RAW: ${{ matrix.py }}
      - name: Run minimum version test
        if: matrix.tox-target == 'min'
        shell: bash
        run: |
          PYTHON_VERSION=$PYTHON_VERSION_RAW
          BASE=${PYTHON_VERSION%-*}
          tox -e $TOX_TARGET-$BASE
        env:
          PYTHON_VERSION_RAW: ${{ matrix.py }}
          TOX_TARGET: ${{ matrix.tox-target }}
      - name: Run path test
        if: matrix.tox-target == 'tox' && matrix.py == '3.10'
        run: tox -e path
      - name: Combine coverage files
        if: always()
        run: tox -e coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        env:
          PYTHON: ${{ matrix.python }}
        with:
          files: .tox/coverage.xml
          flags: tests
          env_vars: PYTHON
          name: ${{ matrix.py }} - ${{ matrix.os }} - ${{ matrix.tox-target }}

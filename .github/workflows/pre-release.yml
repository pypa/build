name: Pre-release
run-name: Pre-release (${{ inputs.bump }})
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pre-release:
    name: Pre-release
    runs-on: ubuntu-26.04
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v')
    environment: release
    permissions:
      contents: read # to checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Configure git identity
        env:
          APP_SLUG: ${{ steps.release-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
      - name: Generate release commit and tag
        run: uv tool run --with tox-uv tox r -e release -- --version "$BUMP" --no-push
        env:
          BUMP: ${{ inputs.bump }}
      - name: Verify docs build against the release commit
        run: uv tool run --with tox-uv tox r -e docs
      - name: Push release commit and tag
        run: |
          gh auth setup-git
          tag=$(git describe --tags --exact-match HEAD)
          git push --atomic origin "HEAD:${BRANCH}" "refs/tags/${tag}"
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          BRANCH: ${{ github.ref_name }}

ci:
  autofix_prs: false
  autoupdate_commit_msg: "pre-commit: bump repositories"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
        exclude: tests/packages/test-(bad-syntax|no-permission)/pyproject.toml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject
  - repo: https://github.com/adamchainz/blacken-docs
    rev: "1.20.0"
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==25.*]
  - repo: https://github.com/google/yamlfmt
    rev: "v0.21.0"
    hooks:
      - id: yamlfmt
  - repo: local
    hooks:
      - id: mdformat
        name: mdformat
        entry: mdformat --wrap 120
        language: python
        types: [markdown]
        additional_dependencies:
          - mdformat-gfm>=1
          - mdformat-ruff>=0.1.3
  - repo: https://github.com/LilSpazJoekp/docstrfmt
    rev: v2.2.1
    hooks:
      - id: docstrfmt
        args: ["-l", "120"]
        additional_dependencies: ["sphinx>=9.1"]
        # title must outrank the included CHANGELOG.rst headings
        exclude: ^docs/changelog\.rst$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/henryiii/flake8-lazy
    rev: v0.9.0
    hooks:
      - id: flake8-lazy
        files: ^src/
        args: [--apply=set]
  - repo: https://github.com/codespell-project/codespell
    rev: "v2.4.3"
    hooks:
      - id: codespell
        args: ["-L", "sur"]
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: "v1.10.0"
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        files: "^\\.github"
        args: [--persona=pedantic]
  - repo: local
    hooks:
      - id: changelog-filenames
        name: Enforce towncrier fragment filenames
        files: ^docs/changelog/(?!([0-9]+\.(feature|bugfix|doc|removal|deprecation|misc)\.rst|template\.jinja2|README\.rst)$).*
        entry: files in changelog must be valid (N.type.rst)
        language: fail
  - repo: https://github.com/henryiii/check-sdist
    rev: v1.6.0
    hooks:
      - id: check-sdist
        args: [--inject-junk]
        additional_dependencies: [flit-core]

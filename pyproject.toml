[build-system]
build-backend = "flit_core.buildapi"
requires = [ "flit-core>=3.11" ]

[project]
name = "build"
description = "A simple, correct Python build frontend"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Filipe Laíns", email = "lains@riseup.net" },
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
  { name = "layday", email = "layday@protonmail.com" },
  { name = "Henry Schreiner", email = "henryschreineriii@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",

  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
# Version read from __version__ field in __init__.py by Flit
dynamic = [ "version" ]
dependencies = [
  "backports-tarfile>=1.2; python_version=='3.11' and python_full_version<'3.11.5'",
  # not actually a runtime dependency, only supplied as there is not "recommended dependency" support
  "colorama; os_name=='nt'",
  "packaging>=24",
  "pyproject-hooks",
]
optional-dependencies.keyring = [
  "keyring",
]
optional-dependencies.uv = [
  "uv>=0.1.18",
]
optional-dependencies.virtualenv = [
  "virtualenv>=20.36.1",
]
urls.changelog = "https://build.pypa.io/en/stable/changelog.html"
urls.homepage = "https://build.pypa.io"
urls.issues = "https://github.com/pypa/build/issues"
urls.source = "https://github.com/pypa/build"
scripts.pyproject-build = "build.__main__:entrypoint"
entry-points."pipx.run".build = "build.__main__:entrypoint"

[dependency-groups]
dev = [
  "flit-core",
  { include-group = "test" },
  { include-group = "pyrefly" },
]
test = [
  "covdefaults>=2.3",
  "filelock>=3.20.1",
  "pip>=22.3",
  "setuptools>=56; python_version=='3.11'",
  "setuptools>=67.8; python_version>='3.12'",
  "setuptools-scm>=6.4.2",
  "wheel>=0.38.1",
  { include-group = "test-core" },
  { include-group = "extra" },
]
docs = [
  "furo>=2025.12.19",
  "pre-commit>=3",
  "proselint>=0.16",
  "sphinx>=8.1",
  "sphinx-argparse-cli>=1.17",
  "sphinx-autodoc-typehints>=2.3",
  "sphinx-copybutton>=0.5.2",
  "sphinx-inline-tabs>=2025.12.21",
  "sphinx-issues>=5",
  "sphinxcontrib-mermaid>=2",
  "towncrier>=24.8",
]
bump = [
  "bump-my-version>=0.10",
]
coverage = [
  "covdefaults>=2.3",
  "coverage[toml]>=6",
  "diff-cover>=6.4.2",
]
extra = [
  "uv>=0.1.18",
  "virtualenv>=20.36.1",
]
lint = [
  "prek",
]
pyrefly = [
  "pyrefly>=1.2",
  { include-group = "typing" },
]
release = [
  "docstrfmt==2.2.1",  # keep in sync with the docstrfmt rev in .pre-commit-config.yaml
  "gitpython>=3.1.44",
  "packaging>=25",
  "pre-commit>=3",
  "towncrier>=24.8",
]
test-core = [
  "pytest>=6.2.5,!=9.1",
  "pytest-cov>=3",
  "pytest-mock>=3.7",
  "pytest-rerunfailures>=10.2",
  "pytest-xdist>=2.4",
]
typing = [
  "backports-tarfile>=1.2",
  "colorama",
  "gitpython>=3.1.44",
  "types-colorama",
  { include-group = "test-core" },
  { include-group = "extra" },
]

[tool.flit]
sdist.include = [ "tests/", ".gitignore", "CHANGELOG.rst", "docs/", ".dockerignore", "tox.toml" ]
sdist.exclude = [
  "**/__pycache__",
  "docs/_build",
  "**/*.egg-info",
  "tests/packages/*/build",
  "docs/changelog/template.jinja2",
  "tasks/*",
]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { docstrfmt = "2026-08-28T18:00:18Z" }

[tool.ruff]
line-length = 127
exclude = [
  "tests/packages/*/pyproject.toml",
  "tests/packages/test-bad-syntax",
]
show-fixes = true
format.quote-style = "single"
lint.select = [ "ALL" ]
lint.ignore = [
  "A002",    # Arguments can shadow builtins
  "ANN401",  # Disallow Any
  "BLE001",  # Blind exceptions are fine if re-raised or passed on
  "COM812",  # Trailing commas teach the formatter
  "CPY001",  # No copyright notice at top of file
  "D",       # Too many doc requests
  "ERA",     # Commented out code
  "FBT",     # Boolean trap hard to fix on existing API
  "N818",    # Using Exception suffix
  "PLC0415", # Import should be at top of file
  "PLR09",   # Too many ...
  "PLR2004", # Magic values
  "PTH",     # Too many change for now
  "Q",       # Using formatter for quotes
  "S101",    # Assert is used by the type checker and pytest
  "SLF001",  # Private members are okay to access
]
lint.per-file-ignores."docs/**.py" = [ "A001", "INP" ]
lint.per-file-ignores."tasks/**.py" = [ "INP", "S607", "T20" ]
lint.per-file-ignores."tests/**.py" = [ "INP", "S", "T20", "TC", "TID251" ]
lint.per-file-ignores."tests/packages/**.py" = [ "ANN", "ARG001", "INP" ]
lint.flake8-tidy-imports.banned-api."os.path.commonprefix".msg = """\
  Use os.path.commonpath or manually implement string manip\
  """
lint.flake8-tidy-imports.banned-api."typing.TYPE_CHECKING".msg = "Use TYPE_CHECKING=False instead"
lint.isort.lines-after-imports = 2
lint.isort.lines-between-types = 1
lint.mccabe.max-complexity = 10

[tool.repo-review]
ignore.PC140 = "type checker in tox"

[tool.check-wheel-contents]
ignore = [
  "W005", # We _are_ build
]

[tool.pyrefly]
python-version = "3.11"
project-includes = [ "docs", "src", "tasks", "tests" ]
project-excludes = [ "**/tests/packages*" ]
search-path = [ "src", "tests" ]
# These style rules reject intentional truthiness checks and side-effect calls throughout the project.
errors.implicit-bool = false
# `@override` needs typing_extensions before 3.12; build takes no runtime deps for typing
errors.missing-override-decorator = false
errors.unused-call-result = false
preset = "all"

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = [ "tests" ]
ini_options.norecursedirs = "tests/integration/*"
ini_options.addopts = [ "-ra", "--strict-config", "--strict-markers" ]
ini_options.markers = [
  "contextvars",
  "isolated",
  "network",
]
ini_options.xfail_strict = true
ini_options.filterwarnings = [
  "error",
  "ignore:path is deprecated.:DeprecationWarning",
  "ignore:The --rsyncdir command line argument and rsyncdirs config variable are deprecated.:DeprecationWarning",
  "ignore:check_home argument is deprecated and ignored:DeprecationWarning:",                                     # PyPy 3.11
  "default:Python 3.14 will, by default, filter extracted tar archives:DeprecationWarning",
  "default:unclosed:ResourceWarning",                                                                             # Python 3.11 Windows
  "ignore:os.path.commonprefix:DeprecationWarning"                                                               # https://github.com/pypa/pyproject-hooks/pull/222
]
ini_options.log_level = "INFO"
ini_options.junit_family = "xunit2"

[tool.coverage]
run.source = [ "build", "tests" ]
run.omit = [
  "tests/conftest.py",
  "tests/integration_sources.py",
  "tests/test_integration.py",
]
run.disable_warnings = [
  "module-not-measured", # Triggers in multithreaded context on build
]
run.plugins = [ "covdefaults" ]
run.core = "ctrace"  # sysmon is 3.14+'s default but can't record dynamic contexts; PyPy falls back to pytrace
paths.build = [
  "src",
  "*/site-packages",
  '*\site-packages',
]
report.omit = [ "src/build/_types.py" ]
report.exclude_also = [
  "if typing.TYPE_CHECKING:",
]
html.show_contexts = true
covdefaults.subtract_omit = "*/__main__.py"

[tool.bumpversion]
current_version = "1.0.0"
files = [
  { filename = "pyproject.toml", search = 'version = "{current_version}"' },
  { filename = "src/build/__init__.py", search = "__version__ = '{current_version}'" },
]

[tool.towncrier]
name = "build"
directory = "docs/changelog"
filename = "CHANGELOG.rst"
template = "docs/changelog/template.jinja2"
title_format = false
issue_format = ":issue:`{issue}`"
underlines = [ "#", "*", "=", "-" ]
type = [
  { directory = "feature", name = "Features", showcontent = true },
  { directory = "bugfix", name = "Bugfixes", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "removal", name = "Removals", showcontent = true },
  { directory = "deprecation", name = "Deprecations", showcontent = true },
  { directory = "misc", name = "Miscellaneous", showcontent = false },
]
section = [ { path = "" } ]
